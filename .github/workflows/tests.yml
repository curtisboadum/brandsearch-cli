name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Smoke test dry-run
        run: PYTHONPATH=src python -m brandsearch_cli.cli brands discover --dry-run --limit 5 --seed ci-test
