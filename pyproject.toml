[project]
name = "brandsearch-cli"
version = "0.1.0"
description = "Quota-safe Brandsearch CLI for humans and AI agents"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Curtis Kusi Boadum" }]
license = "MIT"
keywords = ["brandsearch", "ecommerce", "dtc", "agents", "cli", "market-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/curtisboadum/brandsearch-cli"
Repository = "https://github.com/curtisboadum/brandsearch-cli"
Issues = "https://github.com/curtisboadum/brandsearch-cli/issues"

[project.scripts]
brandsearch = "brandsearch_cli.cli:main"
brandsearch-pp-cli = "brandsearch_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
